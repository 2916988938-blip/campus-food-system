# 校园美食推荐平台 - 配置文件
#
# 数据库密码等敏感信息不写在这里！
# 本地开发请在 src/main/resources/application-local.yaml 中覆盖，
# 该文件已被 .gitignore 排除，不会提交到仓库。
# 参考同目录下的 application-local.yaml.example
server:
  port: 8080

spring:
  application:
    name: campus-food-system

  # 引入本地私有配置（文件不存在时忽略，方便别人克隆后直接跑）
  config:
    import:
      - optional:classpath:application-local.yaml

  # 数据库连接配置（敏感项从环境变量 / 本地配置读取，提供默认值）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/foodpick?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

# MyBatis 配置
mybatis:
  # 实体类字段名和数据库列名自动转换：restaurant_id <-> restaurantId
  configuration:
    map-underscore-to-camel-case: true
